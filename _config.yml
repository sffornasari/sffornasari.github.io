# _pages starts with an underscore, so it must be explicitly included
include: ["_pages"]

# Files/folders from the old theme that should not be processed or copied.
# Safe to keep even after you delete the actual files.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README-DEPLOY.md
  - package.json
  - package-lock.json
  - Rakefile
  - LICENSE
  - staticman.yml
  - banner.js
  - node_modules
  - _sass
  - assets/gulpfile.js
  - assets/src
  - vendor
