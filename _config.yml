# Minimal custom site (no theme): one layout (_layouts/default.html), one stylesheet (assets/css/style.css).

title: "Simone Francesco Fornasari"
description: "Postdoctoral researcher in seismology (earthquake early warning, ground-shaking maps, Bayesian spectral decomposition), University of Trieste."
url: "https://sffornasari.github.io"
baseurl: ""
locale: "en-US"
markdown: kramdown
google_site_verification: K4I53CuABpbZztOMxVkVHQhzQYffzfInqxc_bacEiyA

author:
  name: "Simone Francesco Fornasari"
  bio: "PostDoc in seismology, SeisRaM group, University of Trieste"
  links:
    - label: "GitHub"
      url: "https://github.com/sffornasari"
    - label: "SeisRaM"
      url: "https://seisram.units.it"
    - label: "Google Scholar"
      url: "https://scholar.google.com/citations?user=7x-PgKsAAAAJ"
